version: '3.8'

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: qrgenerator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d qrgenerator"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: backend.Dockerfile
    environment:
      - DATABASE_URL=postgresql+psycopg://user:password@db:5432/qrgenerator
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Persist generated files
      - app_output:/app/output

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NOTE: If deploying to a remote server, change this to your server's public IP or Domain (e.g., http://yourdomain.com:8000)
        - NEXT_PUBLIC_API_BASE=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  app_output:
